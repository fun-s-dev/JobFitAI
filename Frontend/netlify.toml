[build]
  publish = "dist"
  command = "npm run build"

# API reverse-proxy rule FIRST (status 200 rewrite)
[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_URL_HERE/api/:splat"
  status = 200
  force = true

# SPA fallback rule SECOND
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
